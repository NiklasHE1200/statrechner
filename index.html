<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StatRechner</title>
  <meta name="description" content="Taschenrechner für Statistik und Finanzmathematik mit Rechenweg">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StatRechner">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var t = localStorage.getItem('tr-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <!-- Login -->
  <section id="login" class="hidden">
    <div class="aurora"><i></i><i></i><i></i></div>
    <form class="login-card" id="login-form" autocomplete="off">
      <div class="app-icon"><span>Σ</span></div>
      <h1>StatRechner</h1>
      <p>Statistik &amp; Finanzen – mit Rechenweg</p>
      <div class="pw-wrap">
        <input id="pw" type="password" placeholder="Passwort" aria-label="Passwort" autocomplete="current-password">
        <button type="button" id="pw-eye" aria-label="Passwort anzeigen">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="btn-primary" type="submit">Entsperren</button>
      <div class="login-err" id="login-err"></div>
      <a class="demo-link hidden" id="demo-link" href="#" target="_blank" rel="noopener">Ohne Passwort? Demo ansehen →</a>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="hidden">
    <main>
      <section class="view" id="view-calc"></section>
      <section class="view" id="view-tools"></section>
      <section class="view" id="view-tool"></section>
      <section class="view" id="view-projects"></section>
      <section class="view" id="view-project"></section>
      <section class="view" id="view-guide"></section>
    </main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="calc" id="tab-calc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="16" height="19" rx="3.5"/><rect x="7" y="5.5" width="10" height="4" rx="1"/><circle cx="8.5" cy="13.5" r=".6" fill="currentColor"/><circle cx="12" cy="13.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="13.5" r=".6" fill="currentColor"/><circle cx="8.5" cy="17.5" r=".6" fill="currentColor"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="17.5" r=".6" fill="currentColor"/></svg>
        Rechner
      </button>
      <button data-tab="tools" id="tab-tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        Verfahren
      </button>
      <button data-tab="projects" id="tab-projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2.5h7A2.5 2.5 0 0 1 21 9v8.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M8 15.5v-3M12 15.5v-5M16 15.5v-2" stroke-linecap="round"/></svg>
        Projekte
      </button>
      <button data-tab="guide" id="tab-guide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>
        Anleitung
      </button>
    </nav>
  </div>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/fflate.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/format.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tools/registry.js"></script>
  <script src="js/tools/descriptive.js"></script>
  <script src="js/tools/regression.js"></script>
  <script src="js/tools/normal.js"></script>
  <script src="js/tools/inference.js"></script>
  <script src="js/tools/finance.js"></script>
  <script src="js/tools/project-map.js"></script>
  <script src="js/projects.js"></script>
  <script src="guide/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
